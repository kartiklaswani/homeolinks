{% extends "base.html" %}

{% block content %}

<style>
.box {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 30px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

.btn {
    background: #2e7d32;
    color: white;
    padding: 12px 20px;
    text-decoration: none;
    display: inline-block;
    margin-top: 15px;
}
</style>

<div class="section">

<div class="box">

<h2>Appointment Confirmed ✅</h2>

<p><strong>Name:</strong> {{name}}</p>
<p><strong>Date:</strong> {{date}}</p>
<p><strong>Time:</strong> {{time}}</p>

<p>Please click below to notify clinic on WhatsApp.</p>

<a 
    href="https://wa.me/919313575730?text=Hello%20Doctor,%20I%20have%20booked%20an%20appointment%20through%20Homeolinks.%20My%20details%20are:%0A%0AName:%20{{ name }}%0APhone:%20{{ phone }}%0ADate:%20{{ date }}%0ATime:%20{{ time }}"
    target="_blank"
    class="btn btn-success"
>
    Notify Clinic on WhatsApp
</a>

<br><br>

<a href="/" class="btn">Back to Home</a>

</div>

</div>

{% endblock %}
