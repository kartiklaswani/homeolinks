{% extends "base.html" %}

{% block content %}

<style>
.box {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 30px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    border-radius: 12px;
}

.btn {
    background: #2e7d32;
    color: white;
    padding: 12px 20px;
    text-decoration: none;
    display: inline-block;
    margin-top: 15px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}

.btn:hover {
    background: #256428;
}
</style>

<div class="section">

    <div class="box">

        <h2>Appointment Confirmed ✅</h2>

        <p><strong>Name:</strong> {{ name }}</p>
        <p><strong>Phone:</strong> {{ phone }}</p>
        <p><strong>Date:</strong> {{ date }}</p>
        <p><strong>Time:</strong> {{ time }}</p>

        <p>Please click below to notify clinic on WhatsApp.</p>

        <button 
            class="btn"
            onclick="window.open('https://wa.me/919313575730?text=Hello Doctor, I have booked an appointment through Homeolinks.%0A%0AName: {{ name }}%0APhone: {{ phone }}%0ADate: {{ date }}%0ATime: {{ time }}', '_blank')"
        >
            Notify Clinic on WhatsApp
        </button>

        <br><br>

        <a href="/" class="btn">Back to Home</a>

    </div>

</div>

{% endblock %}
