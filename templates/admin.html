{% extends "base.html" %}

{% block content %}

<style>

.container{
    background:white;
    padding:20px;
    border-radius:10px;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th, td{
    padding:12px;
    border:1px solid #ddd;
    text-align:left;
}

th{
    background:#2e7d32;
    color:white;
}

.delete-btn{
    color:red;
    text-decoration:none;
    font-weight:bold;
}

.logout{
    display:inline-block;
    margin-bottom:20px;
    background:#2e7d32;
    color:white;
    padding:10px 18px;
    text-decoration:none;
    border-radius:6px;
}

</style>

<div class="container">

    <h2>Upcoming Appointments</h2>

    <a href="/logout" class="logout">
        Logout
    </a>

    <table>

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Phone</th>
            <th>Date</th>
            <th>Time</th>
            <th>Message</th>
            <th>Action</th>
        </tr>

        {% for a in appointments %}

        <tr>

            <td>{{ a[0] }}</td>
            <td>{{ a[1] }}</td>
            <td>{{ a[2] }}</td>
            <td>{{ a[3] }}</td>
            <td>{{ a[4] }}</td>
            <td>{{ a[5] }}</td>

            <td>
                <a
                    href="/delete_appointment/{{ a[0] }}"
                    class="delete-btn"
                    onclick="return confirm('Delete this appointment?')"
                >
                    Delete
                </a>
            </td>

        </tr>

        {% endfor %}

    </table>

</div>

{% endblock %}
