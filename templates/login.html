{% extends "base.html" %}

{% block content %}

<style>

.login-box{
    max-width:400px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

.input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:6px;
}

.btn{
    background:#2e7d32;
    color:white;
    padding:12px 20px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    width:100%;
    font-size:16px;
}

.btn:hover{
    background:#256428;
}

</style>

<div class="login-box">

    <h2 style="text-align:center;">Admin Login</h2>

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            class="input"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            class="input"
            required
        >

        <button type="submit" class="btn">
            Login
        </button>

    </form>

</div>

{% endblock %}
